# Pull-and-run SANDBOX compose. Images pulled from GHCR on the :sandbox tag — no build, no source.
# The point-in-time broker is in-process inside flash-app; the replay tape mounts at /data.
# Brought up by flash/launch_sandbox.sh (pull + retag runtime + up). No updater, no fleet registry.
services:
  mongo:
    image: ghcr.io/learn-trade-org/flash-mongo:sandbox
    container_name: flash_db
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["bash", "/usr/local/bin/mongo-entrypoint.sh"]
    environment:
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set in .env}
      - MONGO_ROOT_PASS=${MONGO_ROOT_PASS:?MONGO_ROOT_PASS must be set in .env}
      - MONGO_PRIMARY_USER=${MONGO_PRIMARY_USER:?MONGO_PRIMARY_USER must be set in .env}
      - MONGO_PRIMARY_PASS=${MONGO_PRIMARY_PASS:?MONGO_PRIMARY_PASS must be set in .env}
    ports:
      - "${MONGO_HOST_PORT:-7220}:27017"
    volumes:
      - ./db/mongo:/data/db

  app:
    image: ghcr.io/learn-trade-org/flash-app:sandbox
    container_name: flash_app
    restart: unless-stopped
    depends_on:
      - mongo
    group_add:
      - "${DOCKER_GID:-999}"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      HOST_STRATEGY_PATH: ${PWD}/db/strategy
      FLASH_ENV: sandbox
      FLASH_SANDBOX_SELF_URL: http://172.17.0.1:${APP_HOST_PORT:-7200}
      FLASH_SANDBOX_DATA_PATH: /data
      FLASH_SANDBOX_DATA_MODE: ${SANDBOX_DATA_MODE:-tick}
      FLASH_SANDBOX_SEED_DATE: ${SANDBOX_DATE:?SANDBOX_DATE must be set in .env}
      FLASH_SANDBOX_VIRTUAL_START: ${SANDBOX_VIRTUAL_START:?SANDBOX_VIRTUAL_START must be set in .env}
      FLASH_SANDBOX_VIRTUAL_END: ${SANDBOX_VIRTUAL_END:?SANDBOX_VIRTUAL_END must be set in .env}
      FLASH_SANDBOX_CONTROL_KEY: ${SANDBOX_CONTROL_KEY:-}
    ports:
      - "${APP_HOST_PORT:-7200}:10600"
    volumes:
      - ./.env:/app/.env:ro
      - ./db/instrument:/app/instrument
      - ./db/tick:/app/tick
      - ./db/strategy:/app/strategy
      - ${SANDBOX_DATA_DIR:?SANDBOX_DATA_DIR must be set in .env}:/data:ro
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    container_name: flash_caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      FLASH_HOSTNAME: ${FLASH_HOSTNAME:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
