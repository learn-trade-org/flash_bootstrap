# Customer (pull-and-run) compose. The app is a PRE-BUILT image pulled from
# GHCR — no `build:`, no source mounts. Only DATA (./db/*), SECRETS (./.env,
# auto-generated per box), and the mongo bootstrap scripts are bind-mounted.
#
# This file ships inside flash_bootstrap/assets and is copied into the generated
# flash/ runtime dir. Brought up by 03_compose_up.sh / launch.sh with:
#   docker compose -f docker-compose.customer.yml pull && up -d   (NO --build)
#
# Contrast with docker-compose.yml (dev / own-prod): that one builds locally and
# bind-mounts ./backend + ./frontend source. Here the code lives in the image.

services:
  mongo:
    # Baked image — bootstrap scripts (entrypoint.sh + init.js) are COPYed in,
    # not mounted, so the customer box needs no ./container/mongo source.
    # Digest-pinned: .env digest keys are written only by 02_gen_env.sh seed + flash-updater.
    image: ghcr.io/learn-trade-org/flash-mongo@${FLASH_MONGO_DIGEST:?FLASH_MONGO_DIGEST must be set in .env — run 02_gen_env.sh}
    container_name: flash_db
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["bash", "/usr/local/bin/mongo-entrypoint.sh"]
    environment:
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:?MONGO_ROOT_USER must be set in .env}
      - MONGO_ROOT_PASS=${MONGO_ROOT_PASS:?MONGO_ROOT_PASS must be set in .env}
      - MONGO_PRIMARY_USER=${MONGO_PRIMARY_USER:?MONGO_PRIMARY_USER must be set in .env}
      - MONGO_PRIMARY_PASS=${MONGO_PRIMARY_PASS:?MONGO_PRIMARY_PASS must be set in .env}
    ports:
      - "${MONGO_HOST_PORT:-10620}:27017"
    volumes:
      - ./db/mongo:/data/db

  app:
    # Baked image pulled from GHCR — digest-pinned, same rule as mongo above.
    image: ghcr.io/learn-trade-org/flash-app@${FLASH_APP_DIGEST:?FLASH_APP_DIGEST must be set in .env — run 02_gen_env.sh}
    container_name: flash_app
    restart: unless-stopped
    depends_on:
      - mongo
    group_add:
      - "${DOCKER_GID:-0}"
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      HOST_STRATEGY_PATH: ${PWD}/db/strategy
      # Strategy-runtime pins for app-created containers; empty → app's tag default.
      FLASH_STRATEGY_DIGEST: ${FLASH_STRATEGY_DIGEST:-}
      FLASH_STRATEGY_BUN_DIGEST: ${FLASH_STRATEGY_BUN_DIGEST:-}
    ports:
      - "${APP_HOST_PORT:-10600}:10600"
    volumes:
      # Secrets only — code is baked into the image (no ./backend, ./frontend).
      - ./.env:/app/.env:rw          # writable: change-pin mirrors ADMIN_PIN back for SSH recovery
      # Runtime data — survives image destroy/upgrade (one-truth on the host).
      - ./db/instrument:/app/instrument
      - ./db/tick:/app/tick
      - ./db/strategy:/app/strategy
      # Strategy-container engine: drive the host daemon to run sibling
      # flash-strategy-runtime containers.
      - /var/run/docker.sock:/var/run/docker.sock

  # The ONLY other service holding docker.sock — its own image, no shared deps with app.
  # Owns updates end-to-end: fetches the manifest from flashtrade.in, pulls by digest,
  # health-gates, rolls back to a flat last_good.json if the gate fails.
  updater:
    image: ghcr.io/learn-trade-org/flash-updater@${FLASH_UPDATER_DIGEST:?FLASH_UPDATER_DIGEST must be set in .env — run 02_gen_env.sh}
    container_name: flash_updater
    restart: unless-stopped
    depends_on:
      - app
    environment:
      FLASH_HOST_DIR: ${PWD}
      FLASH_REGISTRY_URL: ${FLASH_REGISTRY_URL:-https://flashtrade.in}
      FLEET_REGISTRATION_TOKEN: ${FLEET_REGISTRATION_TOKEN:-}
      FLASH_UPDATE_INTERVAL_SECONDS: ${FLASH_UPDATE_INTERVAL_SECONDS:-86400}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}                      # same absolute host path inside the container — docker.sock
                                       # commands resolve bind mounts against the HOST, not this one
      - ./updater_state:/state
      # Registry auth is CLI-side, not inherited from the host daemon over the socket — reuse the
      # same GHCR login 01b_registry_login.sh already established, read-only.
      - /root/.docker/config.json:/root/.docker/config.json:ro

  caddy:
    image: caddy:2-alpine
    container_name: flash_caddy
    restart: unless-stopped
    # No app->caddy depends_on: a broken hostname keeps caddy down but leaves
    # mongo+app serving on :7200 (HTTPS is additive, not load-bearing).
    depends_on:
      - app
    environment:
      FLASH_HOSTNAME: ${FLASH_HOSTNAME:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certs across restarts → reuse, no LE rate-limit hits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: